name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned, not a floating `channel: stable`. CI picked up 3.50.1 while
          # the project is developed on 3.41.2, and 3.50 deprecated
          # `package:flutter/material.dart` in favour of `package:material_ui`.
          # That turned 16 info-level lints in otherwise-correct code into a
          # build failure. Bump this deliberately, with a local
          # `flutter analyze` + `flutter test` run to match.
          flutter-version: '3.41.2'

      - name: Install dependencies
        run: flutter pub get

      # Fails the build on any analyzer warning, so a clean `flutter analyze`
      # is enforced rather than trusted.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      # Split-per-ABI keeps each APK near 16 MB instead of bundling every
      # architecture into one ~52 MB universal build.
      - name: Build Android Release APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LibreShare-Release-APKs
          path: build/app/outputs/flutter-apk/app-*-release.apk
