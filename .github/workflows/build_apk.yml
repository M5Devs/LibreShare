name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned for reproducible builds, but on the *modern* line: the
          # plugins require it. network_info_plus 8.2.1 applies
          # `KotlinAndroidProjectExtension`, which only the newer Flutter Gradle
          # plugin registers — pinning back to 3.41.2 fails assembleRelease with
          # "Extension of type 'KotlinAndroidProjectExtension' does not exist".
          flutter-version: '3.50.1'

      - name: Install dependencies
        run: flutter pub get

      # Errors and warnings still fail the build. Infos are excluded because
      # Flutter 3.50 flags `package:flutter/material.dart` as deprecated in
      # favour of `package:material_ui` — an upstream migration across all 16
      # Dart files, not a defect in this code. It needs Flutter >=3.47 to build
      # and cannot be verified on the 3.41.2 toolchain, so it is a deliberate
      # follow-up rather than something to smuggle in via a CI runner update.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      # Split-per-ABI keeps each APK near 16 MB instead of bundling every
      # architecture into one ~52 MB universal build.
      - name: Build Android Release APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LibreShare-Release-APKs
          path: build/app/outputs/flutter-apk/app-*-release.apk
