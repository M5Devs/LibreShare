<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LibreShare Web Transfer</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #bb86fc;
      --accent-hover: #9955e8;
      --text-color: #e0e0e0;
      --border-color: #333333;
      --hover-bg: #2a2a2a;
      --progress-bg: #333333;
      --progress-fill: #bb86fc;
      --error-color: #cf6679;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 800px;
      padding: 20px 0;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--accent-color);
    }

    main {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Lock Screen Styles */
    .lock-screen {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 420px;
      margin: 40px auto;
    }

    .lock-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .lock-card h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: var(--accent-color);
    }

    .pin-input-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pin-input {
      width: 140px;
      height: 48px;
      font-size: 1.5rem;
      text-align: center;
      letter-spacing: 8px;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
    }

    .pin-input:focus {
      border-color: var(--accent-color);
    }

    .error-msg {
      color: var(--error-color);
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #666;
      font-size: 0.85rem;
      margin: 8px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider span {
      padding: 0 10px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: var(--accent-color);
      animation: spin 1s ease-in-out infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .approval-status {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #aaa;
      display: none;
    }

    /* App Content Styles */
    .app-content {
      display: none;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    .drop-zone {
      background-color: var(--card-bg);
      border: 2px dashed var(--accent-color);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .drop-zone:hover, .drop-zone.dragover {
      background-color: var(--hover-bg);
    }

    .drop-zone p {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .drop-zone span {
      font-size: 0.9rem;
      color: #888888;
    }

    #file-input {
      display: none;
    }

    .progress-section {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background-color: var(--progress-bg);
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--progress-fill);
      transition: width 0.1s linear;
    }

    .file-list-section {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
    }

    .file-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .file-list-section h2 {
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .refresh-btn:hover {
      background-color: var(--hover-bg);
    }

    .file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background-color: var(--bg-color);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .file-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      margin-right: 12px;
    }

    .file-name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 0.85rem;
      color: #888888;
    }

    .btn {
      background-color: var(--accent-color);
      color: #121212;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s ease, background-color 0.2s ease;
      flex-shrink: 0;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      width: 100%;
    }

    .btn-secondary:hover {
      background-color: rgba(187, 134, 252, 0.1);
    }

    .upload-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .upload-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .upload-card-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }

    .upload-card-meta {
      font-size: 0.85rem;
      color: #aaa;
    }

    .upload-card-controls {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-pause {
      background-color: #f39c12;
      color: #fff;
    }

    .btn-resume {
      background-color: #2ecc71;
      color: #fff;
    }

    .btn-cancel {
      background-color: #e74c3c;
      color: #fff;
    }

</style>
<script src="/eruda.min.js"></script>
  <script>if (window.eruda) eruda.init();</script>
</head>
<body>
  <header>
    <h1>LibreShare Web Transfer</h1>
  </header>

  <main>
    <!-- Lock Screen Section -->
    <div class="lock-screen" id="lock-screen">
      <!-- Section A: PIN Unlock -->
      <div class="lock-card">
        <h2>Enter 4-Digit PIN shown on host device</h2>
        <div class="pin-input-group">
          <input type="text" id="pin-input" class="pin-input" maxlength="4" placeholder="••••" autocomplete="off" />
        </div>
        <button class="btn" id="unlock-btn" style="width: 100%;">Unlock</button>
        <p class="error-msg" id="pin-error">Invalid PIN. Please try again.</p>
      </div>

      <div class="divider"><span>OR</span></div>

      <!-- Section B: Request Approval -->
      <div class="lock-card">
        <button class="btn btn-secondary" id="request-approval-btn">Request Approval on Host Phone</button>
        <div class="approval-status" id="approval-status">
          <span class="spinner"></span>
          <span id="approval-msg">Waiting for confirmation on host phone...</span>
        </div>
      </div>
    </div>

    <!-- App Content Section -->
    <div class="app-content" id="app-content">
      <div class="drop-zone" id="drop-zone">
        <p>Drag and drop files here</p>
        <span>or click to browse from your device</span>
        <input type="file" id="file-input" multiple />
      </div>

      <section class="progress-section" id="progress-section" style="display: none;">
        <h2 style="font-size: 1.1rem; color: var(--text-color); margin-bottom: 8px;">Active Uploads</h2>
        <div id="upload-cards-container" style="display: flex; flex-direction: column; gap: 12px; width: 100%;"></div>
      </section>

      <section class="file-list-section">
        <div class="file-list-header">
          <h2>Available Files</h2>
          <button class="refresh-btn" id="refresh-btn">Refresh</button>
        </div>
        <ul class="file-list" id="file-list">
          <li class="file-item">
            <div class="file-info">
              <span class="file-name">Loading shared files...</span>
              <span class="file-meta">-</span>
            </div>
          </li>
        </ul>
      </section>
    </div>
  </main>

  <script>
    const lockScreen = document.getElementById('lock-screen');
    const appContent = document.getElementById('app-content');
    const pinInput = document.getElementById('pin-input');
    const unlockBtn = document.getElementById('unlock-btn');
    const pinError = document.getElementById('pin-error');
    const requestApprovalBtn = document.getElementById('request-approval-btn');
    const approvalStatus = document.getElementById('approval-status');
    const approvalMsg = document.getElementById('approval-msg');

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileListEl = document.getElementById('file-list');
    const refreshBtn = document.getElementById('refresh-btn');
    const progressSection = document.getElementById('progress-section');
    const progressFilename = document.getElementById('progress-filename');
    const progressPercent = document.getElementById('progress-percent');
    const progressBarFill = document.getElementById('progress-bar-fill');

    let pollInterval = null;

    function showAppContent() {
      if (pollInterval) clearInterval(pollInterval);
      lockScreen.style.display = 'none';
      appContent.style.display = 'flex';
    }

    function showLockScreen() {
      lockScreen.style.display = 'flex';
      appContent.style.display = 'none';
    }

    function formatBytes(bytes) {
      if (bytes === 0 || !bytes) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function checkAuthAndFetchFiles() {
      try {
        const response = await fetch('/api/files');
        if (response.status === 401) {
          showLockScreen();
          return;
        }
        if (!response.ok) throw new Error('Failed to fetch files');
        const files = await response.json();
        showAppContent();
        renderFileList(files);
      } catch (err) {
        console.error('Error fetching files:', err);
      }
    }

    function renderFileList(files) {
      fileListEl.innerHTML = '';
      if (!files || files.length === 0) {
        fileListEl.innerHTML = `
          <li class="file-item">
            <div class="file-info">
              <span class="file-name">No files shared yet</span>
              <span class="file-meta">-</span>
            </div>
          </li>
        `;
        return;
      }

      files.forEach(file => {
        const li = document.createElement('li');
        li.className = 'file-item';

        const infoDiv = document.createElement('div');
        infoDiv.className = 'file-info';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'file-name';
        nameSpan.textContent = file.name;

        const metaSpan = document.createElement('span');
        metaSpan.className = 'file-meta';
        metaSpan.textContent = `${formatBytes(file.size)} • ${file.type || 'Unknown'}`;

        infoDiv.appendChild(nameSpan);
        infoDiv.appendChild(metaSpan);

        const downloadLink = document.createElement('a');
        downloadLink.className = 'btn';
        downloadLink.textContent = 'Download';
        downloadLink.href = `/api/download/${file.id}`;
        downloadLink.setAttribute('download', file.name);

        li.appendChild(infoDiv);
        li.appendChild(downloadLink);

        fileListEl.appendChild(li);
      });
    }

    async function submitPin() {
      const pin = pinInput.value.trim();
      if (pin.length !== 4) {
        pinError.textContent = 'PIN must be 4 digits.';
        pinError.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('/api/auth/pin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pin })
        });

        if (response.ok) {
          pinError.style.display = 'none';
          checkAuthAndFetchFiles();
        } else {
          pinError.textContent = 'Invalid PIN. Please try again.';
          pinError.style.display = 'block';
        }
      } catch (err) {
        pinError.textContent = 'Connection error. Please try again.';
        pinError.style.display = 'block';
      }
    }

    async function requestApproval() {
      requestApprovalBtn.disabled = true;
      approvalStatus.style.display = 'block';
      approvalMsg.textContent = 'Waiting for confirmation on host phone...';

      try {
        const response = await fetch('/api/auth/request-approval', { method: 'POST' });
        if (!response.ok) throw new Error('Request failed');
        const data = await response.json();
        const requestId = data.requestId;

        if (pollInterval) clearInterval(pollInterval);

        pollInterval = setInterval(async () => {
          try {
            const pollRes = await fetch(`/api/auth/poll-approval?requestId=${requestId}`);
            if (pollRes.ok) {
              const pollData = await pollRes.json();
              if (pollData.status === 'approved') {
                clearInterval(pollInterval);
                checkAuthAndFetchFiles();
              } else if (pollData.status === 'rejected') {
                clearInterval(pollInterval);
                approvalMsg.textContent = 'Access rejected by host device.';
                requestApprovalBtn.disabled = false;
              }
            }
          } catch (e) {
            console.error('Polling error:', e);
          }
        }, 1500);
      } catch (err) {
        approvalMsg.textContent = 'Error requesting approval.';
        requestApprovalBtn.disabled = false;
      }
    }


    const CHUNK_SIZE = 2 * 1024 * 1024; // 2 MiB
    const uploadTasks = new Map();

    class UploadTask {
      constructor(file) {
        this.file = file;
        this.uploadId = 'up_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        this.filename = file.name;
        this.totalBytes = file.size;
        this.currentOffset = 0;
        this.status = 'uploading'; // 'uploading' | 'paused' | 'failed' | 'completed' | 'cancelled'
        this.retryCount = 0;
        this.currentXhr = null;
        this.lastTime = Date.now();
        this.lastBytes = 0;
        this.speedStr = '0 B/s';

        this.createCardElement();
      }

      createCardElement() {
        const container = document.getElementById('upload-cards-container');
        document.getElementById('progress-section').style.display = 'block';

        this.card = document.createElement('div');
        this.card.className = 'upload-card';
        this.card.innerHTML = `
          <div class="upload-card-header">
            <span class="upload-card-title" title="${this.filename}">${this.filename}</span>
            <div class="upload-card-controls">
              <button class="btn-small btn-pause" id="btn-toggle-${this.uploadId}">Pause ⏸️</button>
              <button class="btn-small btn-cancel" id="btn-cancel-${this.uploadId}">Cancel ❌</button>
            </div>
          </div>
          <div class="upload-card-meta">
            <span id="meta-size-${this.uploadId}">0 B / ${formatBytes(this.totalBytes)}</span> •
            <span id="meta-speed-${this.uploadId}">0 B/s</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="bar-${this.uploadId}" style="width: 0%;"></div>
          </div>
          <div class="progress-info">
            <span id="status-${this.uploadId}">Uploading...</span>
            <span id="percent-${this.uploadId}">0%</span>
          </div>
        `;
        container.appendChild(this.card);

        this.toggleBtn = this.card.querySelector(`#btn-toggle-${this.uploadId}`);
        this.cancelBtn = this.card.querySelector(`#btn-cancel-${this.uploadId}`);

        this.toggleBtn.addEventListener('click', () => {
          if (this.status === 'uploading') {
            this.pause();
          } else if (this.status === 'paused' || this.status === 'failed') {
            this.resume();
          }
        });

        this.cancelBtn.addEventListener('click', () => {
          this.cancel();
        });
      }

      updateUI() {
        if (!this.card) return;
        const percent = Math.min(100, Math.round((this.currentOffset / this.totalBytes) * 100)) || 0;
        const bar = this.card.querySelector(`#bar-${this.uploadId}`);
        const percentEl = this.card.querySelector(`#percent-${this.uploadId}`);
        const sizeEl = this.card.querySelector(`#meta-size-${this.uploadId}`);
        const speedEl = this.card.querySelector(`#meta-speed-${this.uploadId}`);
        const statusEl = this.card.querySelector(`#status-${this.uploadId}`);

        if (bar) bar.style.width = percent + '%';
        if (percentEl) percentEl.textContent = percent + '%';
        if (sizeEl) sizeEl.textContent = `${formatBytes(this.currentOffset)} / ${formatBytes(this.totalBytes)}`;
        if (speedEl) speedEl.textContent = this.speedStr;

        if (this.status === 'uploading') {
          this.toggleBtn.textContent = 'Pause ⏸️';
          this.toggleBtn.className = 'btn-small btn-pause';
          this.toggleBtn.style.display = 'inline-block';
          if (statusEl) statusEl.textContent = 'Uploading...';
        } else if (this.status === 'paused' || this.status === 'failed') {
          this.toggleBtn.textContent = 'Resume ▶️';
          this.toggleBtn.className = 'btn-small btn-resume';
          this.toggleBtn.style.display = 'inline-block';
          if (statusEl) statusEl.textContent = this.status === 'failed' ? 'Failed (click Resume)' : 'Paused';
        } else if (this.status === 'completed') {
          this.toggleBtn.style.display = 'none';
          if (statusEl) statusEl.textContent = 'Completed ✅';
        }
      }

      async start() {
        await this.syncOffset();
        this.uploadLoop();
      }

      async syncOffset() {
        try {
          const res = await fetch(`/api/upload/status?uploadId=${encodeURIComponent(this.uploadId)}&filename=${encodeURIComponent(this.filename)}`);
          if (res.ok) {
            const data = await res.json();
            this.currentOffset = data.offset || 0;
          }
        } catch (e) {
          console.error('Error fetching upload status:', e);
        }
      }

      async uploadLoop() {
        this.lastTime = Date.now();
        this.lastBytes = this.currentOffset;

        while (this.currentOffset < this.totalBytes && this.status === 'uploading') {
          const chunkEnd = Math.min(this.currentOffset + CHUNK_SIZE, this.totalBytes);
          const chunk = this.file.slice(this.currentOffset, chunkEnd);
          const success = await this.uploadChunkWithRetry(chunk, this.currentOffset, this.totalBytes);

          if (!success) {
            if (this.status === 'uploading') {
              this.status = 'paused';
              this.updateUI();
            }
            break;
          }

          this.currentOffset = chunkEnd;
          this.retryCount = 0;
          this.updateSpeed(this.currentOffset);
          this.updateUI();
        }

        if (this.currentOffset >= this.totalBytes && this.status === 'uploading') {
          this.status = 'completed';
          this.updateUI();
          checkAuthAndFetchFiles();
          setTimeout(() => {
            if (this.card && this.card.parentNode) {
              this.card.parentNode.removeChild(this.card);
            }
            checkHideProgressSection();
          }, 3000);
        }
      }

      updateSpeed(bytesDone) {
        const now = Date.now();
        const duration = (now - this.lastTime) / 1000;
        if (duration >= 0.5) {
          const bytesDiff = bytesDone - this.lastBytes;
          const speed = bytesDiff / duration;
          this.speedStr = formatBytes(speed) + '/s';
          this.lastTime = now;
          this.lastBytes = bytesDone;
        }
      }

      async uploadChunkWithRetry(chunk, offset, total) {
        for (let attempt = 0; attempt <= 3; attempt++) {
          if (this.status !== 'uploading') return false;

          if (attempt > 0) {
            await new Promise((resolve) => setTimeout(resolve, 1000));
            if (this.status !== 'uploading') return false;
          }

          const success = await this.sendChunkXhr(chunk, offset, total);
          if (success) return true;
        }
        return false;
      }

      sendChunkXhr(chunk, offset, total) {
        return new Promise((resolve) => {
          const xhr = new XMLHttpRequest();
          this.currentXhr = xhr;

          xhr.open('POST', '/api/upload/chunk', true);
          xhr.setRequestHeader('X-Upload-Id', this.uploadId);
          xhr.setRequestHeader('X-Chunk-Offset', offset.toString());
          xhr.setRequestHeader('X-Total-Bytes', total.toString());
          xhr.setRequestHeader('X-File-Name', encodeURIComponent(this.filename));

          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const currentLoaded = offset + e.loaded;
              const percent = Math.min(100, Math.round((currentLoaded / total) * 100));
              const bar = this.card.querySelector(`#bar-${this.uploadId}`);
              const percentEl = this.card.querySelector(`#percent-${this.uploadId}`);
              const sizeEl = this.card.querySelector(`#meta-size-${this.uploadId}`);
              if (bar) bar.style.width = percent + '%';
              if (percentEl) percentEl.textContent = percent + '%';
              if (sizeEl) sizeEl.textContent = `${formatBytes(currentLoaded)} / ${formatBytes(total)}`;
              this.updateSpeed(currentLoaded);
            }
          };

          xhr.onload = () => {
            this.currentXhr = null;
            if (xhr.status === 200) {
              resolve(true);
            } else {
              resolve(false);
            }
          };

          xhr.onerror = () => {
            this.currentXhr = null;
            resolve(false);
          };

          xhr.onabort = () => {
            this.currentXhr = null;
            resolve(false);
          };

          xhr.send(chunk);
        });
      }

      pause() {
        this.status = 'paused';
        if (this.currentXhr) {
          this.currentXhr.abort();
          this.currentXhr = null;
        }
        this.updateUI();
      }

      async resume() {
        this.status = 'uploading';
        this.retryCount = 0;
        this.updateUI();
        await this.syncOffset();
        this.uploadLoop();
      }

      async cancel() {
        this.status = 'cancelled';
        if (this.currentXhr) {
          this.currentXhr.abort();
          this.currentXhr = null;
        }

        try {
          await fetch('/api/upload/cancel', {
            method: 'POST',
            headers: {
              'X-File-Name': encodeURIComponent(this.filename),
              'X-Upload-Id': this.uploadId
            }
          });
        } catch (e) {
          console.error('Cancel request error:', e);
        }

        if (this.card && this.card.parentNode) {
          this.card.parentNode.removeChild(this.card);
        }
        uploadTasks.delete(this.uploadId);
        checkHideProgressSection();
      }
    }

    function checkHideProgressSection() {
      const container = document.getElementById('upload-cards-container');
      if (!container || container.children.length === 0) {
        document.getElementById('progress-section').style.display = 'none';
      }
    }

    function uploadFiles(files) {
      if (!files || files.length === 0) return;
      Array.from(files).forEach((file) => {
        const task = new UploadTask(file);
        uploadTasks.set(task.uploadId, task);
        task.start();
      });
    }


    unlockBtn.addEventListener('click', submitPin);
    pinInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') submitPin();
    });

    requestApprovalBtn.addEventListener('click', requestApproval);

    dropZone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      uploadFiles(files);
    });

    fileInput.addEventListener('change', (e) => {
      uploadFiles(e.target.files);
      fileInput.value = '';
    });

    refreshBtn.addEventListener('click', () => {
      checkAuthAndFetchFiles();
    });

    // Check auth state initially
    checkAuthAndFetchFiles();
  </script>
</body>
</html>
