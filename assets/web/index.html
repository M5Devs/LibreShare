<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LibreShare Web Transfer</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #bb86fc;
      --accent-hover: #9955e8;
      --text-color: #e0e0e0;
      --border-color: #333333;
      --hover-bg: #2a2a2a;
      --progress-bg: #333333;
      --progress-fill: #bb86fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 800px;
      padding: 20px 0;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--accent-color);
    }

    main {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .drop-zone {
      background-color: var(--card-bg);
      border: 2px dashed var(--accent-color);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .drop-zone:hover, .drop-zone.dragover {
      background-color: var(--hover-bg);
    }

    .drop-zone p {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .drop-zone span {
      font-size: 0.9rem;
      color: #888888;
    }

    #file-input {
      display: none;
    }

    .progress-section {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background-color: var(--progress-bg);
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--progress-fill);
      transition: width 0.1s linear;
    }

    .file-list-section {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
    }

    .file-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .file-list-section h2 {
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .refresh-btn:hover {
      background-color: var(--hover-bg);
    }

    .file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background-color: var(--bg-color);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .file-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      margin-right: 12px;
    }

    .file-name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 0.85rem;
      color: #888888;
    }

    .btn {
      background-color: var(--accent-color);
      color: #121212;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s ease;
      flex-shrink: 0;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header>
    <h1>LibreShare Web Transfer</h1>
  </header>
  <main>
    <div class="drop-zone" id="drop-zone">
      <p>Drag and drop files here</p>
      <span>or click to browse from your device</span>
      <input type="file" id="file-input" multiple />
    </div>

    <section class="progress-section" id="progress-section">
      <div class="progress-info">
        <span id="progress-filename">Uploading...</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
    </section>

    <section class="file-list-section">
      <div class="file-list-header">
        <h2>Available Files</h2>
        <button class="refresh-btn" id="refresh-btn">Refresh</button>
      </div>
      <ul class="file-list" id="file-list">
        <li class="file-item">
          <div class="file-info">
            <span class="file-name">Loading shared files...</span>
            <span class="file-meta">-</span>
          </div>
        </li>
      </ul>
    </section>
  </main>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileListEl = document.getElementById('file-list');
    const refreshBtn = document.getElementById('refresh-btn');
    const progressSection = document.getElementById('progress-section');
    const progressFilename = document.getElementById('progress-filename');
    const progressPercent = document.getElementById('progress-percent');
    const progressBarFill = document.getElementById('progress-bar-fill');

    function formatBytes(bytes) {
      if (bytes === 0 || !bytes) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function fetchFiles() {
      try {
        const response = await fetch('/api/files');
        if (!response.ok) throw new Error('Failed to fetch files');
        const files = await response.json();
        renderFileList(files);
      } catch (err) {
        console.error('Error fetching files:', err);
      }
    }

    function renderFileList(files) {
      fileListEl.innerHTML = '';
      if (!files || files.length === 0) {
        fileListEl.innerHTML = `
          <li class="file-item">
            <div class="file-info">
              <span class="file-name">No files shared yet</span>
              <span class="file-meta">-</span>
            </div>
          </li>
        `;
        return;
      }

      files.forEach(file => {
        const li = document.createElement('li');
        li.className = 'file-item';

        const infoDiv = document.createElement('div');
        infoDiv.className = 'file-info';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'file-name';
        nameSpan.textContent = file.name;

        const metaSpan = document.createElement('span');
        metaSpan.className = 'file-meta';
        metaSpan.textContent = `${formatBytes(file.size)} • ${file.type || 'Unknown'}`;

        infoDiv.appendChild(nameSpan);
        infoDiv.appendChild(metaSpan);

        const downloadLink = document.createElement('a');
        downloadLink.className = 'btn';
        downloadLink.textContent = 'Download';
        downloadLink.href = `/api/download/${file.id}`;
        downloadLink.setAttribute('download', file.name);

        li.appendChild(infoDiv);
        li.appendChild(downloadLink);

        fileListEl.appendChild(li);
      });
    }

    function uploadFiles(files) {
      if (!files || files.length === 0) return;

      Array.from(files).forEach((file, index) => {
        const formData = new FormData();
        formData.append('file', file);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload', true);

        progressSection.style.display = 'flex';
        progressFilename.textContent = `Uploading ${file.name}...`;
        progressBarFill.style.width = '0%';
        progressPercent.textContent = '0%';

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            progressBarFill.style.width = percent + '%';
            progressPercent.textContent = percent + '%';
          }
        };

        xhr.onload = () => {
          if (xhr.status === 200) {
            progressFilename.textContent = `Uploaded ${file.name} successfully!`;
            setTimeout(() => {
              progressSection.style.display = 'none';
            }, 2000);
            fetchFiles();
          } else {
            progressFilename.textContent = `Upload failed for ${file.name}`;
          }
        };

        xhr.onerror = () => {
          progressFilename.textContent = `Error uploading ${file.name}`;
        };

        xhr.send(formData);
      });
    }

    dropZone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      uploadFiles(files);
    });

    fileInput.addEventListener('change', (e) => {
      uploadFiles(e.target.files);
      fileInput.value = '';
    });

    refreshBtn.addEventListener('click', () => {
      fetchFiles();
    });

    // Initial fetch on load & periodic refresh every 5 seconds
    fetchFiles();
    setInterval(fetchFiles, 5000);
  </script>
</body>
</html>
